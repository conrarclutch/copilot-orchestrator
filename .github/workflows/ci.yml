name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python -m unittest -v examples.python_bridge.test_client examples.python_bridge.test_aiohttp_example
      - run: npm pack --workspace @copilot-orchestrator/chat-renderer
      - run: node bin/copilot-orchestrator.mjs help
